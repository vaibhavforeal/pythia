# Render Blueprint — deploys Pythia as a Docker web service. Accounts and
# saved people live in Supabase Postgres, so no persistent disk is needed.
# Commit this file, then on render.com choose New → Blueprint and point it at
# the repo. Fill the secret vars when prompted.
services:
  - type: web
    name: astroman
    runtime: docker
    plan: free               # no disk needed → the free tier works (spins down when idle)
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true  # Render generates a strong secret once
      - key: CANONICAL_HOST
        sync: false          # set to your custom domain (e.g. pythia.cyou) once its DNS is live
                             # — 301s the onrender.com URL + www to it. Leave unset until then.
      - key: AZURE_DEPLOYMENT
        value: claude-opus-4-8-2
      - key: AZURE_INFERENCE_ENDPOINT
        sync: false          # set in the dashboard (not committed)
      - key: AZURE_INFERENCE_KEY
        sync: false
      # --- Voice calls (Azure Voice Live, BYOM Claude) — OFF by default -------
      # Everything below is inert until VOICE_ENABLED is "true". Kept off
      # deliberately: a realtime session is metered in MINUTES, not requests, and
      # an idle open socket keeps billing. BYOM is not covered by the published
      # Voice Live tier table, so the per-minute rate for this combination is
      # only knowable by making a call and reading Azure Cost Management.
      #
      # Before switching this on, ALL of these must be true:
      #   1. VOICE_DEPLOYMENT points at claude-haiku-4-5. Measured, not assumed:
      #      time from end-of-speech to first audio, on ordinary (non-tool) turns.
      #
      #        haiku-4-5     1779, 1425 ms            mean 1602 ms
      #        opus-4-8      1.7-2.5 s                mean ~2100 ms
      #        sonnet-4-6    2563, 2843, 2223, 3021   mean 2663 ms
      #        bar                                         1500 ms
      #
      #      Sonnet is the SLOWEST of the three, which is the opposite of what
      #      the plan assumed — it writes longer replies, and more words means
      #      more to generate before the first sentence can be synthesised. Small
      #      samples, so re-measure if this matters to a decision. Chat keeps
      #      Opus regardless: it is a written reading, not a conversation.
      #   2. The Foundry resource is in a Voice Live region (~10 of them).
      #   3. A real call's cost has been measured, and MINUTES_PER_DAY set from
      #      that number rather than from this guess.
      #   4. The service is NOT on the free plan. Free spins down after 15 min
      #      idle and takes ~50s to wake, so the first call of a quiet period
      #      fails at the SDP exchange. WebRTC keeps audio off the server, so
      #      Starter is enough — but free is not.
      #   5. The care protocol has been walked through out loud (see
      #      SPOKEN_CARE_ADDENDUM in server/prompts.js).
      - key: VOICE_ENABLED
        value: "false"
      - key: VOICE_DEPLOYMENT
        sync: false          # a fast Claude deployment; NOT the one chat uses
      - key: VOICE_API_VERSION
        value: "2026-01-01-preview"   # probed: the only version the /calls endpoint accepts
      - key: VOICE_ALLOWLIST
        sync: false          # comma-separated user ids for the pilot; empty = everyone
      - key: VOICE_MINUTES_PER_DAY
        value: "10"
      - key: VOICE_MAX_SESSION_SEC
        value: "600"
      - key: VOICE_IDLE_SEC
        value: "45"
      - key: VOICE_STARTS_PER_HOUR
        value: "6"
      - key: VOICE_MAX_CONCURRENT
        value: "2"
      # VOICE_KEY and VOICE_ENDPOINT are deliberately absent — voice runs on the
      # same Foundry resource as chat and reuses AZURE_INFERENCE_*. Set them only
      # if the two ever move apart.
      - key: SUPABASE_URL
        sync: false          # Supabase → Settings → API → Project URL
      - key: SUPABASE_SERVICE_KEY
        sync: false          # Supabase → Settings → API → service_role key (keep secret)
      # --- Google Sign-In (optional) — leave unset to disable the Google button ---
      - key: GOOGLE_CLIENT_ID
        sync: false          # Google Cloud → APIs & Services → Credentials → OAuth client
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false          # optional — pin to https://pythia.cyou/api/auth/google/callback
                             # once CANONICAL_HOST is set; otherwise it's derived from the host

# --- Daily push: deliberately not configured here ---------------------------
# server/push.js, server/notify.js and the /api/devices routes are all still in
# the tree and still tested, but they cannot fire in a browser. Registration
# runs through window.Capacitor.Plugins.PushNotifications (public/push-client.js),
# which no-ops on the web — so no device ever registers, store.devices stays
# empty, and the daily loop would iterate over nothing.
#
# Nothing is broken by their absence: POST /api/cron/daily-push returns 503
# without CRON_SECRET, which is the correct state for a browser-only deploy.
#
# To turn it on you need ALL of the following — configuring the env vars alone
# does nothing:
#   1. A native shell that can actually hold a token. mobile/ has the Capacitor
#      config and sync-web.js, but no android/ or ios/ project; run `cap add`.
#   2. On the web service: CRON_SECRET (generateValue), PUSH_PROVIDER=fcm,
#      PUSH_HOUR_LOCAL (0 is valid), FIREBASE_SERVICE_ACCOUNT (inline JSON).
#   3. A cron service hitting POST /api/cron/daily-push with x-cron-secret.
#      HOURLY, not daily — the handler sends each user at *their* local
#      PUSH_HOUR_LOCAL and skips anyone whose hour hasn't come round.
#      Render will not create it from a deploy; the blueprint must be re-synced.
#
# Note this is FCM as a push transport only, reached over HTTP v1 with a
# service-account JWT. It is not the Firebase backend, which b7d0b06 removed —
# there is no firebase-admin dependency and store.js is Supabase-or-JSON.
