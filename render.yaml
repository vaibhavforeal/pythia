# Render Blueprint — deploys Pythia as a Docker web service. Accounts and
# saved people live in Supabase Postgres, so no persistent disk is needed.
# Commit this file, then on render.com choose New → Blueprint and point it at
# the repo. Fill the secret vars when prompted.
services:
  - type: web
    name: astroman
    runtime: docker
    plan: free               # no disk needed → the free tier works (spins down when idle)
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true  # Render generates a strong secret once
      - key: CANONICAL_HOST
        sync: false          # set to your custom domain (e.g. pythia.cyou) once its DNS is live
                             # — 301s the onrender.com URL + www to it. Leave unset until then.
      - key: AZURE_DEPLOYMENT
        value: claude-opus-4-8-2
      - key: AZURE_INFERENCE_ENDPOINT
        sync: false          # set in the dashboard (not committed)
      - key: AZURE_INFERENCE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false          # Supabase → Settings → API → Project URL
      - key: SUPABASE_SERVICE_KEY
        sync: false          # Supabase → Settings → API → service_role key (keep secret)
      # --- Google Sign-In (optional) — leave unset to disable the Google button ---
      - key: GOOGLE_CLIENT_ID
        sync: false          # Google Cloud → APIs & Services → Credentials → OAuth client
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false          # optional — pin to https://pythia.cyou/api/auth/google/callback
                             # once CANONICAL_HOST is set; otherwise it's derived from the host

# --- Daily push: deliberately not configured here ---------------------------
# server/push.js, server/notify.js and the /api/devices routes are all still in
# the tree and still tested, but they cannot fire in a browser. Registration
# runs through window.Capacitor.Plugins.PushNotifications (public/push-client.js),
# which no-ops on the web — so no device ever registers, store.devices stays
# empty, and the daily loop would iterate over nothing.
#
# Nothing is broken by their absence: POST /api/cron/daily-push returns 503
# without CRON_SECRET, which is the correct state for a browser-only deploy.
#
# To turn it on you need ALL of the following — configuring the env vars alone
# does nothing:
#   1. A native shell that can actually hold a token. mobile/ has the Capacitor
#      config and sync-web.js, but no android/ or ios/ project; run `cap add`.
#   2. On the web service: CRON_SECRET (generateValue), PUSH_PROVIDER=fcm,
#      PUSH_HOUR_LOCAL (0 is valid), FIREBASE_SERVICE_ACCOUNT (inline JSON).
#   3. A cron service hitting POST /api/cron/daily-push with x-cron-secret.
#      HOURLY, not daily — the handler sends each user at *their* local
#      PUSH_HOUR_LOCAL and skips anyone whose hour hasn't come round.
#      Render will not create it from a deploy; the blueprint must be re-synced.
#
# Note this is FCM as a push transport only, reached over HTTP v1 with a
# service-account JWT. It is not the Firebase backend, which b7d0b06 removed —
# there is no firebase-admin dependency and store.js is Supabase-or-JSON.
